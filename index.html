<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bangkok Social Floor</title>
  <meta name="description" content="Live timetable and map of social dance nights in Bangkok: salsa, bachata, swing, tango, kizomba, zouk. RSVP with Google or LINE.">
  <meta property="og:title" content="Bangkok Social Floor">
  <meta property="og:description" content="Where to dance tonight in Bangkok. Live times, venues and RSVPs.">
  <meta name="theme-color" content="#B3124F">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23B3124F'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600;700&family=Anuphan:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <p class="demo" id="demoBanner" hidden></p>

    <header class="top">
      <div class="brand">
        <h1 id="siteName">Bangkok <em>Social</em> Floor</h1>
        <p id="tagline" data-i18n="tagline"></p>
      </div>
      <div class="top-right">
        <div class="clock"><span data-i18n="bangkokNow"></span><b id="clock">--:--</b></div>
        <div class="account">
          <button class="btn ghost small" id="langBtn" aria-label="Switch language"></button>
          <button class="btn small" id="signInBtn" data-i18n="signIn"></button>
          <div class="me" id="meBox" hidden>
            <img id="meAvatar" alt="">
            <span id="meName"></span>
            <span class="role-tag" id="meRole" hidden data-i18n="organiser"></span>
            <button class="btn ghost small" id="signOutBtn" data-i18n="signOut"></button>
          </div>
        </div>
      </div>
    </header>

    <div class="now" id="now" aria-label="Live and starting soon"></div>

    <div class="controls">
      <div class="chips" id="styles" role="group" aria-label="Filter by dance style"></div>
      <div class="row">
        <button class="btn small" id="locateBtn" data-i18n="nearMe"></button>
        <label class="near" for="near"><span data-i18n="orStation"></span>
          <select id="near"></select>
        </label>
        <button class="btn primary small" id="addBtn" hidden data-i18n="addEvent"></button>
      </div>
    </div>

    <div class="grid">
      <main id="list" aria-live="polite"><p class="empty" data-i18n="loading"></p></main>
      <aside class="side">
        <section class="panel">
          <h3 data-i18n="where"></h3>
          <div id="map" class="map"></div>
          <div class="map-note" data-i18n="mapNote"></div>
        </section>
        <section class="panel" id="detail"></section>
      </aside>
    </div>
  </div>

  <dialog id="signInDialog">
    <form method="dialog" class="dialog-body">
      <h2 data-i18n="signInTitle"></h2>
      <p data-i18n="signInBody"></p>
      <button type="button" class="btn provider" id="googleBtn"><span class="g">G</span><span data-i18n="withGoogle"></span></button>
      <button type="button" class="btn provider line" id="lineBtn"><span class="l">LINE</span><span data-i18n="withLine"></span></button>
      <button class="btn ghost" value="close" data-i18n="close"></button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
